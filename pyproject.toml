[project]
name = "web-research-assistant"
version = "0.4.0"
description = "Comprehensive MCP server for web research with 14 tools, 4 resources, and 5 prompts: search (SearXNG + Exa AI), crawl, stealth scrape, package info, GitHub stats, error translation, API docs discovery, and more."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Elad Ben Haim", email = "elad12390@gmail.com"}
]
maintainers = [
    {name = "Elad Ben Haim", email = "elad12390@gmail.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "searxng",
    "exa",
    "web-research",
    "ai-tools",
    "claude",
    "search",
    "crawling",
    "scrapling",
    "stealth-scraping",
    "package-registry",
    "github-api",
    "error-translator",
    "api-documentation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.29.0,<2",
    "httpx>=0.28.1,<0.29",
    "scrapling[fetchers]>=0.4.12",
    "html2text>=2025.4.15",
    "beautifulsoup4>=4.15.0",
]

[project.urls]
Homepage = "https://github.com/elad12390/web-research-assistant"
Repository = "https://github.com/elad12390/web-research-assistant"
Issues = "https://github.com/elad12390/web-research-assistant/issues"
Changelog = "https://github.com/elad12390/web-research-assistant/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
]

[project.scripts]
web-research-assistant = "searxng_mcp.server:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-bdd>=8.1.0",
]
